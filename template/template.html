<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Pendulum Simulation</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: #00ffca;
            letter-spacing: 1px;
        }

        .canvas-container {
            border: 2px solid #1a1a24;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            background-color: #0a0a0f;
        }

        /* Le canvas SDL3 ne doit avoir ni padding ni bordure directe pour éviter de fausser les coordonnées de la souris */
        canvas.emscripten {
            border: 0 none;
            background-color: #0a0a0f;
            display: block;
        }

        .status-message {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #707080;
        }
    </style>
</head>
<body>

    <h1>Double Pendulum Chaos Experiment</h1>

    <div class="canvas-container">
        <!-- C'est ici que SDL3 viendra injecter son rendu graphique -->
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </div>

    <div class="status-message" id="status">Chargement du moteur physique C++...</div>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');

        // L'objet global 'Module' est l'interface entre JavaScript et ton code C++
        var Module = {
            preRun: [],
            postRun: [],
            print: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.log(text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                // Gestion de la perte de contexte WebGL (sécurité navigateur)
                canvas.addEventListener("webglcontextlost", function(e) { 
                    alert('Contexte WebGL perdu, veuillez recharger la page.'); 
                    e.preventDefault(); 
                }, false);
                return canvas;
            })(),
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                
                Module.setStatus.last.time = Date.now();
                Module.setStatus.last.text = text;
                
                if (text) {
                    statusElement.innerHTML = text;
                    statusElement.style.display = 'block';
                } else {
                    statusElement.style.display = 'none'; // Cache le texte quand le chargement est fini
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Préparation... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : '');
            }
        };

        Module.setStatus('Téléchargement du WASM...');
        window.onerror = function(event) {
            Module.setStatus('Une erreur est survenue (voir la console).');
        };
    </script>
    
    <!-- Cette balise magique est indispensable. Emscripten la remplacera automatiquement à la compilation par le script d'injection standard -->
    {{{ SCRIPT }}}
    
</body>
</html>
